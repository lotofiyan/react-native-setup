name: e2e-ios-visual-regression

on:
  pull_request:
    branches: [main]

jobs:
  ios-e2e-argos:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      NODE_VERSION: 20
      ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
      DETOX_CONFIGURATION: ios.sim.debug
      METRO_PORT: 8081
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s "${DEVELOPER_DIR}"
          xcodebuild -version

      - name: Install native tooling
        run: |
          brew install --quiet watchman
          brew tap wix/brew
          brew install --quiet applesimutils

      - name: Install dependencies
        run: npm ci

      # ✅ Don’t hardcode "iPhone 15" (often missing on runners). Create one from available runtime.
      - name: Create & boot simulator
        run: |
          set -e

          # Pick the newest available iOS runtime on the runner
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          ios=[r for r in d['runtimes'] if r.get('isAvailable') and r.get('platform')=='iOS']
          ios_sorted=sorted(ios, key=lambda r: r.get('version','0'))
          print(ios_sorted[-1]['identifier'])
          ")

          # Pick a safe, widely-compatible iPhone device type (avoid hardcoding iPhone 15)
          # Prefer: iPhone 14 -> iPhone 13 -> iPhone 12 -> first iPhone found
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          iph=[t for t in d['devicetypes'] if 'iPhone' in t['name']]
          preferred=['iPhone 14','iPhone 13','iPhone 12','iPhone 11']
          by_name={t['name']:t['identifier'] for t in iph}
          for p in preferred:
            if p in by_name:
              print(by_name[p]); sys.exit(0)
          print(iph[0]['identifier'])
          ")

          echo "Using runtime: $RUNTIME"
          echo "Using device type: $DEVICE_TYPE"

          UDID=$(xcrun simctl create "Detox-iPhone" "$DEVICE_TYPE" "$RUNTIME")
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV

          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      # ✅ Build the iOS app without running "expo run:ios" (that command keeps streaming logs and never exits in CI)
      # If your Detox build step already builds the binary, you can delete this step.
      - name: Build for Detox (via detox build)
        run: |
          export DETOX_DEVICE_ID="$SIMULATOR_UDID"
          npx detox build -c $DETOX_CONFIGURATION

      # ✅ Start Metro and WAIT until it’s actually ready (no flaky sleep)
      - name: Start Metro bundler
        run: |
          set -e

          npx expo start --dev-client --port $METRO_PORT --clear --non-interactive > metro.log 2>&1 &
          echo $! > /tmp/metro_pid

          for i in {1..60}; do
            if curl -sf "http://127.0.0.1:$METRO_PORT/status" | grep -q "packager-status:running"; then
              echo "Metro is running."
              exit 0
            fi
            sleep 2
          done

          echo "Metro failed to start in time"
          tail -200 metro.log || true
          exit 1

      - name: Run Detox E2E and upload to Argos
        run: |
          export DETOX_DEVICE_ID="$SIMULATOR_UDID"
          npm run e2e:ios:argos

      - name: Upload artifacts (screenshots/logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argos-artifacts
          path: |
            __argos__/**
            metro.log
            *.log
            *.txt

      - name: Stop Metro
        if: always()
        run: |
          if [ -f /tmp/metro_pid ]; then
            kill $(cat /tmp/metro_pid) || true
          fi
